.hd>*{max-width:1280px}

.sub{color:var(--mu);margin:0 0 14px;max-width:70ch}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:14px;padding:4px;background:var(--pa);border:1px solid var(--ln);border-radius:12px;box-shadow:var(--sh);scrollbar-width:thin}
.tabs button{white-space:nowrap;flex:none;border:0;background:transparent;color:var(--mu);font-weight:600;padding:8px 14px;border-radius:9px}
.tabs button:hover{background:var(--ac2);color:var(--fg)}
.tabs button.on{background:var(--ac);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
select,button,label.b,input:not([type=checkbox]):not([type=file]){font:inherit;padding:7px 12px;border:1px solid var(--ln);background:var(--pa);color:var(--fg);border-radius:9px;transition:background .15s,border-color .15s,box-shadow .15s}
select,button,label.b{cursor:pointer}
button:hover,label.b:hover,select:hover{border-color:var(--ac);background:var(--ac2)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
label.b{font-weight:600;color:#fff;background:var(--ac);border-color:var(--ac)}
label.b:hover{background:var(--ac);filter:brightness(1.1)}
#cl{color:var(--mu)}#cl:hover{border-color:#c0392b;background:transparent;color:#c0392b}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.w{overflow-x:auto;border:1px solid var(--ln);border-radius:14px;background:var(--pa);box-shadow:var(--sh)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:720px}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--ln);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:var(--zb)}
thead th{font:600 13px "Barlow Condensed",sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);background:var(--zb);border-bottom:1px solid var(--ln)}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
td small{display:block;font-size:11px;opacity:.75}
td.g1,td.g2,td.am,td.rd{font-weight:600}
.g1{background:var(--g1)}.g2{background:var(--g2)}.am{background:var(--am)}.rd{background:var(--rd)}.na{color:var(--mu)}
.note{color:var(--mu);font-size:13px;margin-top:12px;max-width:90ch}
.row{display:grid;grid-template-columns:minmax(120px,1fr) 3fr 110px;gap:10px;align-items:center;padding:6px 0}
.ch{display:inline-block;padding:3px 11px;margin:3px 4px 3px 0;border:1px solid var(--ln);border-radius:999px;font-size:13px;background:var(--pa)}
.ch.rd{background:var(--rd);border-color:transparent}.ch.am{background:var(--am);border-color:transparent}
.pitch{max-width:500px;margin:0 auto;padding:22px 8px;border:2px solid rgba(255,255,255,.8);border-radius:14px;background:repeating-linear-gradient(0deg,#2c7c46 0 10%,#276f3e 10% 20%);box-shadow:var(--sh);display:flex;flex-direction:column;gap:22px;position:relative}
.pitch::before,.pitch::after{content:"";position:absolute;left:27%;right:27%;height:12%;border:2px solid rgba(255,255,255,.55);pointer-events:none}
.pitch::before{top:0;border-top:0}.pitch::after{bottom:0;border-bottom:0}
.pr{display:flex;justify-content:space-around;align-items:flex-start;position:relative;z-index:1}
.sp{flex:0 0 23%;text-align:center;color:#fff;font-size:12px;line-height:1.2;text-shadow:0 1px 2px rgba(0,0,0,.55)}
.mr{width:100%;max-width:84px;aspect-ratio:1;margin:0 auto 4px;background:var(--pa);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--fg);text-shadow:none;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.mr svg{width:100%;height:100%}.pn small{display:block;opacity:.85;font-size:11px}
.hh{font:700 24px "Barlow Condensed",Impact,sans-serif;letter-spacing:.03em;text-transform:uppercase;margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.hh::before{content:"";width:5px;height:1em;border-radius:3px;background:var(--ac)}
tr[data-p]{cursor:pointer}tr[data-p]:hover{background:var(--ac2)}tr.sel{outline:2px solid var(--ac);outline-offset:-2px}
.r th:nth-child(2),.r td:nth-child(2){text-align:right}
#dz.on{outline:3px dashed var(--ac);outline-offset:-6px}
.fl{align-items:center;color:var(--mu);font-size:13px;margin-bottom:12px;padding:8px 12px;background:var(--pa);border:1px solid var(--ln);border-radius:12px;gap:12px}
.fl label{display:flex;align-items:center;gap:6px}.fl select{padding:5px 9px;font-size:14px}
.app{display:grid;grid-template-columns:200px minmax(0,1fr) 190px;gap:16px;align-items:start}
.mid{min-width:0}
.side{position:sticky;top:12px;display:flex;flex-direction:column;gap:4px;padding:10px;background:var(--pa);border:1px solid var(--ln);border-radius:14px;box-shadow:var(--sh)}
.side .st{font:700 13px "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);padding:2px 10px 6px}
.side button{border:0;background:transparent;color:var(--mu);font-weight:600;text-align:left;padding:9px 12px;border-radius:9px;width:100%}
.side button:hover{background:var(--ac2);color:var(--fg)}
.side button.on{background:var(--ac);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
#nr{border-color:color-mix(in srgb,var(--ac) 35%,var(--ln))}
#t11{font-weight:600}
@media(max-width:980px){.app{grid-template-columns:1fr;gap:10px}.side{position:static;flex-direction:row;overflow-x:auto;padding:4px;align-items:center;scrollbar-width:thin}.side .st{padding:0 8px;flex:none}.side button{width:auto;flex:none;white-space:nowrap;padding:7px 12px}#nl{order:1}#nr{order:2}.mid{order:3}}
.w>svg{display:block;margin-top:8px}
.kp{padding:14px 16px;border-radius:14px}.kp b{display:block;font:700 36px/1.05 "Barlow Condensed",Impact,sans-serif}.kp span{color:var(--mu);font-size:13px}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.w[style*="padding"]{padding:14px 18px!important}
